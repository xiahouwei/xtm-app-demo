def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    //throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

def dartDefine = [DART_DEFINE_APP_ENV: 'release']
if (project.hasProperty('dart-defines')) {
    dartDefine = project.property('dart-defines')
            .split(',')
            .collectEntries { entry ->
                def pair = new String(entry.decodeBase64(), 'UTF-8').split('=')
                [(pair.first()): pair.last()]
            }
}

def emulatorAbiFilters = dartDefine['DART_DEFINE_APP_ENV'] == 'release' ? [] : ['x86', 'x86_64']

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.tjxtm.tmstransport"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        flavorDimensions "versionCode"

        ndk {
            abiFilters = ['armeabi-v7a', "arm64-v8a"] + emulatorAbiFilters
            // abiFilters 'armeabi-v7a'
            // abiFilters 'arm64-v8a'
            // abiFilters 'armeabi'
            // abiFilters 'x86', 'x86_64' /**模拟器*/
        }
    }

    signingConfigs {
        release {
            keyAlias 'zhgt'
            keyPassword 'niuinfo123'
            storeFile file('../jks/zhgt')
            storePassword 'niuinfo123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildToolsVersion = '30.0.3'
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.amap.api:3dmap:7.7.0'
    implementation 'com.amap.api:location:5.2.0'
    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'com.android.support:support-annotations:28.0.0'
}
